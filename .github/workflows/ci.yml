name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Compile
        run: python -m compileall -q projectctl

      - name: Enforce schema source policy
        run: |
          if [ -d schemas/generated ]; then
            echo "::error::schemas/generated must not be versioned; projectctl.schema_export is the implementation authority."
            exit 1
          fi

      - name: Validate public schema export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from projectctl.schema_export import PUBLIC_SCHEMAS, export_json_schemas

          destination = Path("/tmp/projectctl-schemas")
          written = export_json_schemas(destination)
          assert [path.name for path in written] == sorted(PUBLIC_SCHEMAS)
          assert {path.name for path in destination.glob("*.schema.json")} == set(PUBLIC_SCHEMAS)
          for path in written:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert isinstance(payload, dict)
              assert "properties" in payload or "$defs" in payload
          PY

  codex-sdk-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Codex SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,codex]"

      - name: Validate Codex public API contract
        run: |
          pytest -q             tests/test_m12b_codex_sdk_contract.py             tests/test_m12b_codex_adapter.py
