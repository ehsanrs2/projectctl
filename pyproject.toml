[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "projectctl"
version = "0.30.0"
description = "Local-first deterministic control plane for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "ProjectCTL contributors"}]
dependencies = [
  "pydantic>=2.13,<3",
  "typer>=0.26,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
codex = [
  "openai-codex==0.160.0",
]
dev = [
  "pytest>=9,<10",
  "hypothesis>=6.168,<7",
]

[project.scripts]
projectctl = "projectctl.cli.entry:main"

[tool.hatch.build.targets.wheel]
packages = ["projectctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
